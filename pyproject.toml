[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-manager"
version = "0.1.2"
description = "Desktop administration GUI for local AI backends"
authors = [{ name = "Henry", email = "henry@local" }]
dependencies = [
    "PyQt6>=6.5.0",
    "pydantic>=2.0.0",
    "ruamel.yaml>=0.18.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.2.0",
    "respx>=0.20.0",
]

[project.scripts]
ai-manager = "ai_manager.main:main"

[tool.setuptools.package-data]
ai_manager = ["resources/icons/*.svg"]

